<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/style.css">
    <title>DataBase</title>
</head>
<body onload="getNavMenu()">
    <nav></nav>
    <h1>DataBase</h1>
    <div id="table"></div>
    <!--<ol>
        <li><a href="inc/main.php">Main</a></li>
        <li><a href="inc/groups.php">Groups</a></li>
    </ol>-->
    <script>
        function getNavMenu()
        {
            let request = new XMLHttpRequest();
            request.onreadystatechange = function ()
            {
                if (this.readyState == 4 && this.status == 200)
                {
                    document.getElementsByTagName('nav')[0].innerHTML = this.responseText;
                }
            }
            request.open("GET", "inc/nav.php", true);
            request.send();
        }
        function loadTable(e)
        {
            let request = new XMLHttpRequest();
            request.onreadystatechange = function ()
            {
                if (this.readyState == 4 && this.status == 200)
                {
                    document.getElementById("table").innerHTML = this.responseText;
                }
            }
            request.open("GET", `inc/load_table.php?q=${e.target.id}&html_id=${e.target.id}`, true);
            request.send();
        }
        function filterTable(e)
        {
            let request = new XMLHttpRequest();
            request.onreadystatechange = function ()
            {
                //alert('onreadystatechange' + e.target.name + '=' + e.target.value);
                if (this.readyState == 4 && this.status == 200)
                {
                    document.getElementById("table").innerHTML = this.responseText;
                }
            }
            request.open("GET", `inc/load_table.php?q=${document.getElementById("table").getElementsByTagName("table")[0].id}&filter=${e.target.name + '=' + e.target.value}&html_id=${document.getElementById("table").getElementsByTagName("table")[0].id}`);

            //request.open("GET", `inc/load_table.php?q=${document.getElementById("table").getElementsByTagName("table")[0].id)}&filter=${direction=e.target.value}`);
            request.send();
            //alert(document.getElementById("table").getElementsByTagName("table")[0].id);
            //alert('FILTER TABLE' + e.target.name + '=' + e.target.value);
        }
    </script>
</body>
</html>
